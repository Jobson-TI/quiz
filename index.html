<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <link href="style.css" rel="stylesheet">
        <title>Quiz</title>
    </head>
    <body>
        <div id="tela-inicio">
            <h1 id="inicio">Escolha um tema</h1>
            <div id="button-div"></div>
        </div>
        <div id="tela-jogo">
            <h1 id="titulo"></h1>
            <h2 id="texto"></h2>
            <div id="opcao"></div>
            <button id="proximo">Próximo</button>
        </div>
        <div id="tela-resultado">
            <p id="pontuação"></p>
            <p id="mensagem"></p>
            <button id="restart">Jogar de novo</button>
            <button id="tema">Trocar de temas</button>
        </div>
        <script src="script.js"></script>
    </body>
</html>
